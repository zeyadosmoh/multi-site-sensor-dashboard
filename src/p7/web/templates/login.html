{% extends "base.html" %}
{% block title %}{{ t("login_title") }}{% endblock %}
{% block content %}
<section class="login card">
  <h1>{{ t("login_title") }}</h1>
  <p class="muted">{{ t("login_intro") }}</p>
  {% if error %}<p class="alert error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>{{ t("username") }}<input name="username" autocomplete="username" required autofocus dir="ltr"></label>
    <label>{{ t("password") }}<input name="password" type="password" autocomplete="current-password" required dir="ltr"></label>
    <button class="primary" type="submit">{{ t("login") }}</button>
  </form>
</section>
{% endblock %}
