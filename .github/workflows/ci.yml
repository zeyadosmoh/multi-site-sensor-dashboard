name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pipeline + tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: p7
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: p7
        ports: ["5437:5432"]
        options: >-
          --health-cmd "pg_isready -U p7 -d p7"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # CI-only values for a throwaway database. Nothing secret.
      POSTGRES_USER: p7
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: p7
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5437"
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-only-admin-password
      REPORTS_DIR: reports
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Playwright Chromium (with system dependencies, CI runner only)
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check src tests scripts

      - name: i18n keys (en complete, ar has every en key)
        run: python scripts/check_i18n_keys.py

      - name: Generate synthetic data (seed 7) and check the committed sample zip is reproducible
        run: python -m p7 generate --sample-month 2026-08 && git diff --exit-code data/sample/

      - name: Migrate, load all 78 files, verify against manifest.json
        run: |
          python -m p7 migrate
          python -m p7 create-admin
          python -m p7 ingest data/synthetic/xlsx --no-reports --strict
          python -m p7 verify-manifest

      - name: Re-ingest everything (must change nothing)
        run: |
          python -m p7 ingest data/synthetic/xlsx --no-reports | tee reingest.txt
          ! grep -v '^duplicate_file' reingest.txt

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Sample PDFs (August 2026, EN + AR)
        run: |
          python -m p7 report --month 2026-08 --lang en,ar
          python -m p7 report --month 2026-08 --site KHB-01 --lang en,ar
          python -m p7 report --month 2026-08 --site JED-01 --lang en,ar

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: sample-reports
          path: reports/2026-08/
          retention-days: 14

  docker:
    name: app image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t p7-sensors-app:ci .
